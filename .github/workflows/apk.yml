name: APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# G2-15 : deux pushes rapproches ne lancent qu un build ; le plus ancien
# est annule au profit du plus recent.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # G2-15 : actions epinglees par SHA de commit (majeur conserve).
      - name: Recuperer le depot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '9.4.1'

      # G2-15 : regenerer le jar du wrapper (fichier binaire non versionne)
      # puis construire avec ./gradlew, reproductible pour les developpeurs.
      - name: Wrapper Gradle
        run: |
          gradle wrapper --gradle-version 9.4.1 --no-daemon
          chmod +x gradlew

      # G2-12 : lintDebug + testDebugUnitTest dans la CI.
      # G1-03 : cle de signature dans les secrets GitHub (jamais dans le depot).
      - name: Cle de signature release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/geneapoche-release.jks
            echo "GP_KEYSTORE=/tmp/geneapoche-release.jks" >> $GITHUB_ENV
            echo "GP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "GP_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "GP_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Secrets de signature absents : APK release signe avec la cle debug (non debuggable)."
          fi

      - name: Compiler les APK debug et release
        run: |
          set +e
          ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --no-daemon > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep '^e: ' /tmp/build.log | head -10 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-300)"
            done
            # G2-12 : echecs de tests unitaires visibles directement dans la CI.
            grep -E 'FAILED|expected:|AssertionError|not mocked' /tmp/build.log | head -20 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-300)"
            done
            if ! grep -q '^e: ' /tmp/build.log && ! grep -qE 'FAILED|AssertionError|not mocked' /tmp/build.log; then
              grep -A 12 'What went wrong' /tmp/build.log | head -14 | while IFS= read -r l; do
                echo "::error::$(echo "$l" | cut -c1-300)"
              done
              tail -20 /tmp/build.log | while IFS= read -r l; do
                echo "::error::$(echo "$l" | cut -c1-300)"
              done
            fi
            exit 1
          fi

      - name: Publier l'APK debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geneapoche-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geneapoche-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  # G2-15 : release GitHub quand un tag v* est pousse OU quand une branche
  # release-* est poussee (les tags ne sont pas poussables par l integration).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '9.4.1'

      - name: Wrapper Gradle
        run: |
          gradle wrapper --gradle-version 9.4.1 --no-daemon
          chmod +x gradlew

      - name: Cle de signature release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/geneapoche-release.jks
            echo "GP_KEYSTORE=/tmp/geneapoche-release.jks" >> $GITHUB_ENV
            echo "GP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "GP_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "GP_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Secrets de signature absents : APK release signe avec la cle debug (non debuggable)."
          fi

      - name: Compiler les APK debug et release
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Creer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == release-* ]]; then TAG="v${GITHUB_REF_NAME#release-}"; fi
          VERSION="${TAG#v}"
          # v0.45 : le numero de version figure dans le NOM du fichier telecharge.
          cp app/build/outputs/apk/release/app-release.apk "GeneaPoche-v${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "GeneaPoche-v${VERSION}-debug.apk"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            "GeneaPoche-v${VERSION}-release.apk#APK release (a installer)" \
            "GeneaPoche-v${VERSION}-debug.apk#APK debug" \
            --title "GeneaPoche $TAG" \
            --generate-notes \
            || gh release upload "$TAG" --clobber \
              "GeneaPoche-v${VERSION}-release.apk" \
              "GeneaPoche-v${VERSION}-debug.apk"
