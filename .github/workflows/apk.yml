name: APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# G2-15 : deux pushes rapproches ne lancent qu un build ; le plus ancien
# est annule au profit du plus recent.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # G2-15 : actions epinglees par SHA de commit (majeur conserve).
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.8.2
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.8.2'

      # G2-15 : regenerer le jar du wrapper (fichier binaire non versionne)
      # puis construire avec ./gradlew, reproductible pour les developpeurs.
      - name: Wrapper Gradle
        run: |
          gradle wrapper --gradle-version 9.8.2 --no-daemon
          chmod +x gradlew

      # G2-12 : lintDebug + testDebugUnitTest dans la CI.
      # G1-03 : cle de signature dans les secrets GitHub (jamais dans le depot).
      - name: Cle de signature release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/geneapoche-release.jks
            echo "GP_KEYSTORE=/tmp/geneapoche-release.jks" >> $GITHUB_ENV
            echo "GP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "GP_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "GP_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Secrets de signature absents : APK signes avec la cle stable du depot (app/geneapoche-signature.jks)."
          fi

      - name: Compiler les APK debug et release
        run: |
          set +e
          ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --no-daemon > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep '^e: ' /tmp/build.log | head -10 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-300)"
            done
            # G2-12 : echecs de tests unitaires visibles directement dans la CI.
            grep -E 'FAILED|expected:|AssertionError|not mocked' /tmp/build.log | head -20 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-300)"
            done
            # v0.141 : message exact des assertions en echec (rapports JUnit).
            grep -rhE -A2 '<failure message=' app/build/test-results 2>/dev/null | head -12 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-400)"
            done
            if ! grep -q '^e: ' /tmp/build.log && ! grep -qE 'FAILED|AssertionError|not mocked' /tmp/build.log; then
              grep -A 12 'What went wrong' /tmp/build.log | head -14 | while IFS= read -r l; do
                echo "::error::$(echo "$l" | cut -c1-300)"
              done
              tail -20 /tmp/build.log | while IFS= read -r l; do
                echo "::error::$(echo "$l" | cut -c1-300)"
              done
            fi
            exit 1
          fi

      # v0.140 : controle de la signature. Sans secrets, les deux APK DOIVENT porter
      # le certificat stable du depot (sinon Android refuse la mise a jour).
      - name: Verifier la signature des APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ATTENDU=$(keytool -list -v -keystore app/geneapoche-signature.jks -storepass geneapoche 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          for t in debug release; do
            REEL=$("$APKSIGNER" verify --print-certs "app/build/outputs/apk/$t/app-$t.apk" | grep -m1 "certificate SHA-256 digest" | sed 's/.*: //')
            echo "APK $t : certificat $REEL"
            if [ -z "$GP_KEYSTORE" ] && [ "$REEL" != "$ATTENDU" ]; then
              echo "::error::APK $t non signe avec la cle stable du depot (attendu $ATTENDU)"
              exit 1
            fi
          done

      # v0.133 : le numero de version figure dans le NOM des fichiers telecharges
      # depuis les artefacts (comme pour les releases).
      - name: Nommer les APK avec la version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION_APK=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/GeneaPoche-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/GeneaPoche-v${VERSION}-release.apk"

      - name: Publier l'APK debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geneapoche-v${{ env.VERSION_APK }}-debug
          path: app/build/outputs/apk/debug/GeneaPoche-v${{ env.VERSION_APK }}-debug.apk

      - name: Publier l'APK release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geneapoche-v${{ env.VERSION_APK }}-release
          path: app/build/outputs/apk/release/GeneaPoche-v${{ env.VERSION_APK }}-release.apk

  # G2-15 : release GitHub quand un tag v* est pousse OU quand une branche
  # release-* est poussee (les tags ne sont pas poussables par l integration).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.8.2
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.8.2'

      - name: Wrapper Gradle
        run: |
          gradle wrapper --gradle-version 9.8.2 --no-daemon
          chmod +x gradlew

      - name: Cle de signature release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/geneapoche-release.jks
            echo "GP_KEYSTORE=/tmp/geneapoche-release.jks" >> $GITHUB_ENV
            echo "GP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "GP_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "GP_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Secrets de signature absents : APK signes avec la cle stable du depot (app/geneapoche-signature.jks)."
          fi

      - name: Compiler les APK debug et release
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Creer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == release-* ]]; then TAG="v${GITHUB_REF_NAME#release-}"; fi
          VERSION="${TAG#v}"
          # v0.45 : le numero de version figure dans le NOM du fichier telecharge.
          cp app/build/outputs/apk/release/app-release.apk "GeneaPoche-v${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "GeneaPoche-v${VERSION}-debug.apk"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            "GeneaPoche-v${VERSION}-release.apk#APK release (a installer)" \
            "GeneaPoche-v${VERSION}-debug.apk#APK debug" \
            --title "GeneaPoche $TAG" \
            --generate-notes \
            || gh release upload "$TAG" --clobber \
              "GeneaPoche-v${VERSION}-release.apk" \
              "GeneaPoche-v${VERSION}-debug.apk"
