name: APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Compiler l'APK debug
        run: |
          set +e
          gradle assembleDebug --no-daemon > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep '^e: ' /tmp/build.log | head -10 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-300)"
            done
            if ! grep -q '^e: ' /tmp/build.log; then
              grep -A 12 'What went wrong' /tmp/build.log | head -14 | while IFS= read -r l; do
                echo "::error::$(echo "$l" | cut -c1-300)"
              done
              tail -20 /tmp/build.log | while IFS= read -r l; do
                echo "::error::$(echo "$l" | cut -c1-300)"
              done
            fi
            exit 1
          fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: geneapoche-apk
          path: app/build/outputs/apk/debug/app-debug.apk
